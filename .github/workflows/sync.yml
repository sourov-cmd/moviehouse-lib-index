name: Library sync

# Every hour: read what changed on the source, resolve the new files, push the difference to the
# MovieHouse Library index. Public repo = unlimited Actions minutes, so the app's private build
# minutes are never touched. The crawler's state is kept encrypted (LIB_STATE_KEY) as the one asset
# of the `state` release; logs print counts only.
#
# Secrets: LIB_INGEST_BASE, LIB_INGEST_KEY, LIB_STATE_KEY.

# 2026-10-13: ONCE A DAY. Since 2026-10-11 the source hides its file codes behind Turnstile and its file host
# redirects every direct request, so an hourly run spent ~55 minutes to find 1 new file. One daily run keeps the
# index honest and shows the day the source opens again (new files found > 0); then set the repository variable
# LIB_SYNC_CHAIN=1 to go back to a run every hour.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget for this run in minutes (backfill: up to 330)"
        default: "50"
      crawl_minutes:
        description: "Of which, at most this long reading title pages"
        default: "20"
      runner:
        description: "Where to run: ubuntu-latest, or mh-lab (the owner's own server, registered as a self-hosted runner, for a backfill)"
        default: "ubuntu-latest"
      resolve_concurrency:
        description: "Files resolved at once (8 on GitHub; a nearby server with many cores can take far more)"
        default: "8"
      round:
        description: "Files per resolve round (each round is pushed, then the next starts)"
        default: "1500"

concurrency:
  group: lib-sync
  cancel-in-progress: false

jobs:
  sync:
    # Scheduled runs always use GitHub's machines; only a dispatch may name the self-hosted backfill server.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 345
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      LIB_DB: ${{ github.workspace }}/state/index.sqlite
      LIB_CONCURRENCY: "6"
      LIB_RESOLVE_CONCURRENCY: ${{ inputs.resolve_concurrency || '8' }}
      LIB_ROUND: ${{ inputs.round || '1500' }}
      # 2026-10-14: the file host shows Turnstile to plain requests; new files go through a real browser (3 tabs,
      # rounds of 300, each round pushed). D1 writes on the Library account: this source 45k/day, movielinkbd 40k/day,
      # 15k left for the shelf flags and the app (was the free plan's 100k/day until the 2026-10-31 move to the paid account).
      LIB_BROWSER: "1"
      LIB_BROWSER_ROUND: "300"
      LIB_BROWSER_TABS: "5"
      LIB_PROXY_SERVER: "http://${{ secrets.BD_PROXY_SERVER }}"
      LIB_PROXY_USER: ${{ secrets.BD_PROXY_USER }}
      LIB_PROXY_PASS: ${{ secrets.BD_PROXY_PASS }}
      # 2026-10-31: the Library moved to snrgngbd (Workers Paid: 50M D1 rows written/month included), so the
      # free-plan share (45k/day) is lifted.
      LIB_DAILY_ROWS: "400000"
      LIB_QUIET: "1"
      # A second egress lane (owner's Bright Data proxy, 2026-10-11): the source allows ~2 requests/s per IP,
      # so two lanes resolve about twice as fast. Empty secret = direct line only, exactly as before.
      LIB_PROXIES: ${{ secrets.LIB_PROXIES }}
      LIB_BASE: ${{ secrets.LIB_INGEST_BASE }}
      LIB_KEY: ${{ secrets.LIB_INGEST_KEY }}
      STATE_KEY: ${{ secrets.LIB_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet beautifulsoup4 lxml numpy patchright
          python -m patchright install --with-deps chromium >/dev/null
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)

      - name: Time budget
        run: |
          M="${{ inputs.minutes }}"; C="${{ inputs.crawl_minutes }}"
          M="${M:-50}"; C="${C:-20}"
          now=$(date +%s)
          echo "LIB_CRAWL_BY=$((now + C*60))" >> "$GITHUB_ENV"
          echo "LIB_RESOLVE_BY=$((now + M*60))" >> "$GITHUB_ENV"

      - name: Fetch the state
        run: |
          mkdir -p state
          if gh release download state --repo "$GITHUB_REPOSITORY" --pattern index.sqlite.enc --dir state 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state/index.sqlite.enc -out "$LIB_DB"
            rm state/index.sqlite.enc
          elif [ -f bootstrap/index.sqlite.gz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in bootstrap/index.sqlite.gz.enc | gunzip > "$LIB_DB"
            echo "state from bootstrap"
          else
            echo "::error::no saved state"; exit 1
          fi

      - name: Crawl, resolve, push
        run: |
          set -o pipefail
          # the browser's own noise (dbus, inotify) is dropped; a crawler failure still fails the step
          xvfb-run -a python3 cinefreak.py cycle --round "$LIB_ROUND" 2>&1 | { grep --line-buffered -v -E "ERROR:|inotify|dbus" || true; }

      - name: Save the state
        if: always()
        run: |
          [ -s "$LIB_DB" ] || exit 0
          python3 cinefreak.py stats | head -6
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:STATE_KEY -in "$LIB_DB" -out state/index.sqlite.enc
          gh release view state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create state --repo "$GITHUB_REPOSITORY" --title "state" --notes "Encrypted crawler state, replaced by every run." --latest=false
          gh release upload state state/index.sqlite.enc --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep the schedule alive
        if: always()
        run: |
          # GitHub pauses schedules in a repo with no commit for 60 days; touch a file after 30
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" --jq '.[0].commit.committer.date')
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 86400 ))
          if [ "$age" -ge 30 ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/.keepalive" --jq .sha 2>/dev/null || true)
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.keepalive" -f message="keepalive" -f content="$(date -u +%FT%TZ | base64)" ${sha:+-f sha=$sha} >/dev/null
          fi

      - name: Next run in an hour (the schedule alone is not reliable)
        if: ${{ !cancelled() && vars.LIB_SYNC_CHAIN == '1' }}
        run: |
          # 2026-10-30: this step used to sleep here, inside the job that holds the `lib-sync` concurrency lock.
          # A run that finished its crawl at 18:20 then sat "in_progress" until 19:12 doing nothing, and every
          # other sync run queued behind it — two runs were stuck for 40+ minutes on 30 Oct while the queue grew.
          # The wait now lives in chain.yml, which has its own concurrency group, so this job ends as soon as the
          # crawl does and the lock is released.
          gh workflow run chain.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "chain.yml started; it will pace the next sync"

