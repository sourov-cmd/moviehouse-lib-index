name: mlbd runner probe
# Viktor 2026-10-14: throwaway branch for movielinkbd crawler probes (delete the branch when done).
on:
  push:
    branches: [viktor-mlbd-probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet patchright && python -m patchright install --with-deps chromium
      - run: cd mlbd && xvfb-run -a python probe_list.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: out, path: /tmp/out, retention-days: 1 }
