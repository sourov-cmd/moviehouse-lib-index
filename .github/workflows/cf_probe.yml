name: cinefreak host probe
# Viktor 2026-10-14: one-off test on a throwaway branch (delete when done): what do the file host's pages hold now?
on:
  push:
    branches: [viktor-cf-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet patchright && python -m patchright install --with-deps chromium
      - run: cd probe && xvfb-run -a python cf_probe5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: out, path: /tmp/out, retention-days: 1 }
