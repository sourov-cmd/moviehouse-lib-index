name: probe-r2
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe R2 public fetch
        run: |
          echo "== range fetch, production UA =="
          curl -s -D - -o /tmp/b.bin --max-time 40 -A "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/126.0.0.0" -H "Range: bytes=0-1023" "https://pub-eb0dd3d4c4c84462bc3e3f1f8a3f1b61.r2.dev/CINEFREAK.TOP%20-%20Raavan%20%282022%29%20WEB-DL%20%5BBengali-Hindi%5D%20720p%20ESub.mkv" | head -12
          ls -la /tmp/b.bin; head -c 16 /tmp/b.bin | xxd | head -2
