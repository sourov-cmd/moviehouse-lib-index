name: Browser resolve test (no push)

# 2026-10-14 (Viktor): proves the browser pass on GitHub's machines with a COPY of the saved state.
# Nothing is pushed to the Library and the state is not saved back. Logs are counts only.
on:
  push:
    branches: [viktor/cf-browser]
    paths: [".github/workflows/cf_browser_test.yml", "cinefreak.py"]

concurrency:
  group: lib-sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      LIB_DB: ${{ github.workspace }}/state/index.sqlite
      LIB_QUIET: "1"
      STATE_KEY: ${{ secrets.LIB_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet beautifulsoup4 lxml numpy patchright
          python -m patchright install --with-deps chromium >/dev/null
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          command -v xvfb-run >/dev/null || sudo apt-get install -y -qq xvfb
      - name: Copy of the state
        run: |
          mkdir -p state
          gh release download state --repo "$GITHUB_REPOSITORY" --pattern index.sqlite.enc --dir state
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state/index.sqlite.enc -out "$LIB_DB"
          rm state/index.sqlite.enc
      - name: Before
        run: python3 cinefreak.py stats
      - name: Crawl (incl. the one-time re-read of cut file codes), resolve, browser pass
        run: |
          now=$(date +%s); export LIB_CRAWL_BY=$((now+18*60)) LIB_RESOLVE_BY=$((now+60*60))
          python3 cinefreak.py crawl
          python3 cinefreak.py resolve --limit 20000
          xvfb-run -a python3 cinefreak.py bresolve --limit 400 2>&1 | grep --line-buffered -v -E "ERROR|inotify|dbus" || true
      - name: What the browser pass found (counts)
        run: |
          python3 - <<'PY'
          import sqlite3, os, time
          c = sqlite3.connect(os.environ["LIB_DB"])
          since = int(time.time()) - 50 * 60
          for r in c.execute("SELECT host, quality, COUNT(*), SUM(start_ms IS NOT NULL), SUM(bytes > 0) FROM files WHERE resolved_at > ? AND host != 'wall' GROUP BY 1, 2", (since,)):
              print("resolved", r)
          for r in c.execute("SELECT res_err, COUNT(*) FROM files WHERE host='wall' AND res_err IS NOT NULL GROUP BY 1"):
              print("wall", (r[0] or "")[:40], r[1])
          print("titles that gained a playable r2 file:", c.execute("SELECT COUNT(DISTINCT slug) FROM files WHERE host='r2' AND resolved_at > ?", (since,)).fetchone()[0])
          PY
      - name: After
        run: python3 cinefreak.py stats
