name: Proxy egress probe (one-off)
# One-off check (2026-11-07): can this repo's Bright Data proxy lane fetch a public R2 file head?
# Reads the crawler state read-only, prints only statuses and counts, never links.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.LIB_STATE_KEY }}
      P_SERVER: ${{ secrets.BD_PROXY_SERVER }}
      P_USER: ${{ secrets.BD_PROXY_USER }}
      P_PASS: ${{ secrets.BD_PROXY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch one R2 file head, proxy vs direct
        run: |
          mkdir -p state out
          gh release download state --repo "$GITHUB_REPOSITORY" --pattern index.sqlite.enc --dir state
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in state/index.sqlite.enc -out state/index.sqlite
          python3 - <<'PY'
          import os, sqlite3, urllib.request, urllib.error
          from urllib.parse import urlparse, quote
          conn = sqlite3.connect("state/index.sqlite")
          row = conn.execute("SELECT url FROM files WHERE host='r2' AND url IS NOT NULL AND COALESCE(start_ms,0)=0 LIMIT 1").fetchone()
          url = row[0]
          srv = os.environ["P_SERVER"]
          if "://" not in srv: srv = "http://" + srv
          u = urlparse(srv)
          auth = ""
          if os.environ.get("P_USER"): auth = quote(os.environ["P_USER"], safe="") + ":" + quote(os.environ.get("P_PASS",""), safe="") + "@"
          proxy = f"{u.scheme}://{auth}{u.hostname}:{u.port}"
          lines = []
          for label, op in (("proxy", urllib.request.build_opener(urllib.request.ProxyHandler({"http": proxy, "https": proxy}))), ("direct", urllib.request.build_opener())):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/126.0.0.0", "Range": "bytes=0-1023"})
                  with op.open(req, timeout=40) as r:
                      body = r.read(1024)
                      lines.append(f"{label}: HTTP {r.status} read={len(body)}B type={r.headers.get('Content-Type')} range={r.headers.get('Content-Range')}")
              except urllib.error.HTTPError as e:
                  e.read()
                  lines.append(f"{label}: HTTP {e.code}")
              except Exception as e:
                  lines.append(f"{label}: ERROR {type(e).__name__} {str(e)[:120]}")
          open("out/verdict.txt", "w").write("\n".join(lines) + "\n")
          print("probe done")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-probe-verdict
          path: out/verdict.txt
          retention-days: 1
