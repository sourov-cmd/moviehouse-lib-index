name: Proxy egress probe (one-off)
# One-off check (2026-11-07): which egress lanes pass the r2.dev bot wall?
# Tests a NONEXISTENT object on the relay buckets: 403 = walled, 404 = passed (R2 answered).
# Prints statuses only, never links or credentials.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BD_SERVER: ${{ secrets.BD_PROXY_SERVER }}
      BD_USER: ${{ secrets.BD_PROXY_USER }}
      BD_PASS: ${{ secrets.BD_PROXY_PASS }}
      LANES: ${{ secrets.LIB_PROXIES }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wall test per egress lane
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          from urllib.parse import quote
          HOSTS = ["pub-10da0f41c8ea4953ac9ba4a3ec208325.r2.dev", "pub-eb0dd3d4c4c84462bc3e3f1f8a3f1b61.r2.dev"]
          lanes = [("direct", None)]
          srv = os.environ.get("BD_SERVER", "")
          if srv:
              if "://" not in srv: srv = "http://" + srv
              from urllib.parse import urlparse
              u = urlparse(srv)
              auth = ""
              if os.environ.get("BD_USER"): auth = quote(os.environ["BD_USER"], safe="") + ":" + quote(os.environ.get("BD_PASS",""), safe="") + "@"
              lanes.append(("bd-secret", f"{u.scheme}://{auth}{u.hostname}:{u.port}"))
          for i, p in enumerate([x.strip() for x in os.environ.get("LANES", "").split(",") if x.strip()]):
              lanes.append((f"lane{i+1}", p))
          lines = [f"lanes configured: {len(lanes)}"]
          for label, proxy in lanes:
              op = urllib.request.build_opener(urllib.request.ProxyHandler({"http": proxy, "https": proxy})) if proxy else urllib.request.build_opener(urllib.request.ProxyHandler({}))
              for h in HOSTS:
                  url = f"https://{h}/__wall_test_9f3k_nonexistent__"
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/126.0.0.0"})
                      with op.open(req, timeout=35) as r:
                          r.read(256); lines.append(f"{label} bucket{h[4:12]}: HTTP {r.status}")
                  except urllib.error.HTTPError as e:
                      e.read(); lines.append(f"{label} bucket{h[4:12]}: HTTP {e.code}")
                  except Exception as e:
                      lines.append(f"{label} bucket{h[4:12]}: ERROR {type(e).__name__} {str(e)[:90]}")
          open("out/verdict.txt", "w").write("\n".join(lines) + "\n")
          print("probe done")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-probe-verdict
          path: out/verdict.txt
          retention-days: 1
